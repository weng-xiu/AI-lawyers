# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径：生产环境必须通过环境变量 RUOYI_PROFILE 显式指定挂载目录（如 /data/ai-lawyers/uploadPath）
  profile: ${RUOYI_PROFILE:./data/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 文件上传路径配置
file:
  path: ${RUOYI_PROFILE:./data/uploadPath}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  # P3-C6：优雅停机——收到 SIGTERM 后停止接收新请求，等待在途 HTTP 请求/WS 升级结束
  # （等待上限 spring.lifecycle.timeout-per-shutdown-phase），配合 nginx 摘流量实现无损发布
  shutdown: graceful
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数（与下游DB/Redis连接池容量匹配，避免容量倒挂）
    accept-count: 200
    threads:
      # tomcat最大线程数：按下游容量反推（DB连接池50），勿盲目调大
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 20

# 日志配置：生产环境保持 info，debug 会记录咨询文本等隐私内容（合规风险）
logging:
  level:
    ai.lawyers: info
    org.springframework: warn

# ============================================================
# T5-1 监控暴露：actuator + micrometer-prometheus
# 仅暴露 prometheus/health/info；生产建议经内网/网关 ACL 限制抓取源，
# 或通过 management.server.port 使用独立管理端口
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      # SB3：分组校验关闭（readinessState/livenessState 未注册时避免启动失败）
      validate-group-membership: false
      # P3-C6：探针分组——nginx/负载均衡经 /actuator/health/readiness 决定是否路由：
      # 停机时 readinessState 自动 REFUSING_TRAFFIC，drain 指示器同步翻 OUT_OF_SERVICE；
      # /actuator/health/liveness 仅反映进程存活（异常才重启，停机不翻）
      group:
        readiness:
          include: readinessState,drain
        liveness:
          include: livenessState
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ai-lawyers-hotline
    distribution:
      # 百分位直方图，供 Prometheus histogram_quantile 计算 P95/P99
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

# P3-C6：在途通话排空配置（无损发布 drain 参数）
app:
  # P0-3：生产安全自检开关——置 true（环境变量 APP_SECURITY_GUARD=true）或启用 Spring prod profile 后，
  # 启动时校验 JWT/数据库/Druid 口令，命中空值或内置默认值即拒绝启动（fail-fast）。默认关闭，开发零影响
  security:
    guard: ${APP_SECURITY_GUARD:false}
  shutdown:
    drain:
      # 等待在途通话结束的最长时间（秒），须 < spring.lifecycle.timeout-per-shutdown-phase
      max-wait-seconds: ${DRAIN_MAX_WAIT_SECONDS:30}
      # 在途通话计数轮询间隔（秒）
      poll-interval-seconds: ${DRAIN_POLL_INTERVAL_SECONDS:1}
      # 排空开始时通知本机 WS 客户端（坐席工作台）重连到其他实例
      notify-websocket: ${DRAIN_NOTIFY_WEBSOCKET:true}

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # SB3 兼容性：允许循环依赖（历史遗留，后续专项重构消除）
  main:
    allow-circular-references: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # P3-C6：优雅停机每阶段等待上限；在途通话 drain 总时长须小于该值，超时强制退出
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:45s}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # P3-C3：@Scheduled 定时任务调度线程池
  # Spring 默认调度池仅 1 个线程，18 个定时任务（外呼扫描/SLA/分钟聚合/线路探测等）串行排队，
  # 任一长任务（外呼一轮最多 50 个拨号）会饿死其余任务；扩为 5 线程并行。
  # 同一任务 Spring 仍保证不并发（fixedDelay/cron 串行触发），跨实例互斥继续由 RedisLeaderLock 保证。
  task:
    scheduling:
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:5}
      thread-name-prefix: ai-sched-
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # 密码：生产环境必须通过环境变量 REDIS_PASSWORD 注入强密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 4
        # 连接池中的最大空闲连接
        max-idle: 16
        # 连接池的最大数据库连接数（与Tomcat线程数匹配，消除容量倒挂）
        max-active: 32
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 3000ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：生产环境必须通过环境变量 TOKEN_SECRET 注入 >=32字节随机密钥，禁止使用默认值入库入git
  secret: ${TOKEN_SECRET:Z2xwLWExMmwtbGF3eWVycy1qd3Qtc2VjcmV0LWtleS0yMDI2LWNoYW5nZS1tZS1pbi1wcm9kLTA5ODc2NTQz}
  # 上一版令牌密钥（密钥轮换过渡期使用，留空则不启用降级验签）：
  # 轮换流程——将旧 secret 移入 previous-secret，生成新 secret 填入，重启后旧 token 仍可验签至过期，平滑无感知
  previous-secret: ${TOKEN_PREVIOUS_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# N5 WebSocket 握手鉴权（/ws/call、/ws/chat 必须携带有效 JWT，?token= 或 ?access_token=）
# 生产保持 true；仅联调/紧急排障可经环境变量 WEBSOCKET_AUTH_ENABLED=false 临时关闭
websocket:
  auth:
    enabled: ${WEBSOCKET_AUTH_ENABLED:true}
  # N4 多实例跨实例推送：多实例（>1 个后端）部署时置 true，经 Redis Pub/Sub 把推送扇出到
  # 持有目标连接的实例，并在 Redis 维护全局在线注册表；单机保持 false（零行为变化）
  cluster:
    enabled: ${WEBSOCKET_CLUSTER_ENABLED:false}
  # P3-A1 流式语音端点 /ws/voice：默认开启（当前仅 Mock 流式 ASR/TTS 引擎，无外网/凭证可联调；
  # 真实 DashScope 等 Provider 随 A2/A3 接入，请求未接入引擎会显式回 error 帧，不静默假成功）
  # max-sessions 为本机连接上限（每连接 2 个守护线程，按容量规划）；send-queue-capacity 为单连接保序下发队列
  voice:
    enabled: ${WEBSOCKET_VOICE_ENABLED:true}
    max-sessions: ${WEBSOCKET_VOICE_MAX_SESSIONS:200}
    send-queue-capacity: ${WEBSOCKET_VOICE_QUEUE_CAP:1000}

# N1 Redis Stream 消费重试（PEL 重读 + 真实投递计数 + 死消费者接管）
# 应急可置 queue.stream.retry-enabled=false 恢复旧行为（失败即转死信）
queue:
  stream:
    enabled: ${QUEUE_STREAM_ENABLED:true}
    retry-enabled: ${QUEUE_STREAM_RETRY_ENABLED:true}
    reclaim-min-idle-ms: ${QUEUE_STREAM_RECLAIM_MIN_IDLE_MS:60000}

# N7/N3/N12 集群单主协调（Redis SET NX + Lua CAS 释放）
# 定时任务、ESL 竞选、数据清理均经此组件保证多实例只一个执行者；
# 单机或应急排障可置 CLUSTER_LOCK_ENABLED=false 回退为每实例各自执行
cluster:
  lock:
    enabled: ${CLUSTER_LOCK_ENABLED:true}
    key-prefix: ${CLUSTER_LOCK_KEY_PREFIX:ai-law:lock:}

# N12 数据生命周期清理（默认 enabled=false + dry-run=true 双保险，不删任何数据）
# 经合规确认保留期后：先置 enabled=true 观察试运行日志，再置 dry-run=false 实际删除
data:
  retention:
    enabled: ${DATA_RETENTION_ENABLED:false}
    dry-run: ${DATA_RETENTION_DRY_RUN:true}
    cron: ${DATA_RETENTION_CRON:0 30 3 * * ?}
    batch-size: ${DATA_RETENTION_BATCH_SIZE:1000}
    max-batches: ${DATA_RETENTION_MAX_BATCHES:100}
    dial-log-months: ${DATA_RETENTION_DIAL_LOG_MONTHS:3}
    agent-status-log-months: ${DATA_RETENTION_AGENT_STATUS_LOG_MONTHS:6}
    sms-log-months: ${DATA_RETENTION_SMS_LOG_MONTHS:6}
    video-consult-log-months: ${DATA_RETENTION_VIDEO_LOG_MONTHS:6}
    ivr-execution-log-months: ${DATA_RETENTION_IVR_EXEC_LOG_MONTHS:1}
    ivr-intention-log-months: ${DATA_RETENTION_IVR_INTENTION_LOG_MONTHS:1}
    # 智能质检记录默认保留 12 个月（P3-F1 纳管），调整前确认复核追溯要求
    quality-inspection-months: ${DATA_RETENTION_QUALITY_INSPECTION_MONTHS:12}
    # AI 智能体对话消息默认保留 6 个月（P3-F1 纳管）
    agent-message-months: ${DATA_RETENTION_AGENT_MESSAGE_MONTHS:6}
    # 话单+录音默认保留 36 个月，调整前必须确认当地政务热线归档合规要求
    call-record-months: ${DATA_RETENTION_CALL_RECORD_MONTHS:36}
    delete-recording-file: ${DATA_RETENTION_DELETE_RECORDING_FILE:true}

  # P3-F1 话单冷热分离归档（DataArchiveTask）：热表超 keep-months 的话单分批迁入
  # ai_call_record_archive（按月分区，DDL 见 sql/ai_system_f1_archive_partition_20260926.sql）。
  # 开启前必须先执行归档表 DDL；开启后 N12 对话单自然命中 0 行，录音文件随 F2 管理或用
  # delete-recording-file-months 过渡接管。默认关闭+dry-run 双保险。
  archive:
    enabled: ${DATA_ARCHIVE_ENABLED:false}
    dry-run: ${DATA_ARCHIVE_DRY_RUN:true}
    cron: ${DATA_ARCHIVE_CRON:0 40 3 * * ?}
    batch-size: ${DATA_ARCHIVE_BATCH_SIZE:500}
    max-batches: ${DATA_ARCHIVE_MAX_BATCHES:200}
    # 话单在线保留月数（更早迁移归档，历史可查），默认 12 个月
    keep-months: ${DATA_ARCHIVE_KEEP_MONTHS:12}
    # 已归档话单的磁盘录音文件到期清理月数（0=关闭；如设 36 删文件并置空 record_file，行保留）
    delete-recording-file-months: ${DATA_ARCHIVE_DELETE_RECORDING_FILE_MONTHS:0}

# ============================================================
# AI 大模型调用与 RAG 检索配置（T2-1 连接池 / T3 RAG 混合检索）
# ============================================================
ai:
  model:
    # 在途大模型调用并发舱壁（与 DB/Redis 连接池、模型侧限流匹配）
    max-inflight: ${AI_MODEL_MAX_INFLIGHT:32}
    # 获取在途许可最长等待（毫秒），超时快速失败
    acquire-timeout-ms: ${AI_MODEL_ACQUIRE_TIMEOUT_MS:3000}
    http:
      # OkHttp 共享连接池：最大空闲连接、保活秒数、建连超时毫秒
      maxIdleConnections: ${AI_HTTP_MAX_IDLE:32}
      keepAliveSeconds: ${AI_HTTP_KEEPALIVE_SECONDS:300}
      connectTimeoutMs: ${AI_HTTP_CONNECT_TIMEOUT_MS:10000}
    # P3-E5 大模型调用成本/质量埋点：异步写 ai_model_call_log；SQL 未执行或排障时可关
    call-log:
      enabled: ${AI_MODEL_CALL_LOG_ENABLED:true}
  rag:
    # RAG 总开关：关闭后智能体不检索知识、退回纯模型对话；分块/向量索引不重建
    enabled: ${AI_RAG_ENABLED:true}
    # embedding 专用模型配置ID（ai_model_config 中指向 /v1/embeddings 兼容端点，如 bge-small-zh）
    embedding-config-id: ${AI_RAG_EMBEDDING_CONFIG_ID:0}
    # embedding 模型名（config-id 未配置时，用默认模型的 apiUrl/apiKey + 此模型名）
    embedding-model: ${AI_RAG_EMBEDDING_MODEL:}
    # 最终拼 Prompt 的知识条数
    top-k: ${AI_RAG_TOP_K:3}
    # 每路召回候选数（融合池大小）
    candidate-size: ${AI_RAG_CANDIDATE_SIZE:20}
    # 单块拼入 Prompt 的最大字符数
    chunk-max-len: ${AI_RAG_CHUNK_MAX_LEN:500}
    # 向量索引后端（P3-C5）：memory=JVM 内存（默认，单实例）；redis=Redis Stack VSS 多实例共享，
    # 写入双写内存快照作降级底账，读取 Redis 异常时当次自动降级内存
    vector-store: ${AI_RAG_VECTOR_STORE:memory}
    # Cross-Encoder rerank 精排（需部署 rerank 服务，默认关闭）
    rerank-enabled: ${AI_RAG_RERANK_ENABLED:false}
    rerank-url: ${AI_RAG_RERANK_URL:}
    rerank-model: ${AI_RAG_RERANK_MODEL:bge-reranker-base}
    rerank-api-key: ${AI_RAG_RERANK_API_KEY:}
  # T4-1 智能质检
  quality:
    # 质检总开关：关闭则不投递/不消费质检任务
    enabled: ${AI_QUALITY_ENABLED:true}
    # 录音就绪后是否自动入检
    auto-on-hangup: ${AI_QUALITY_AUTO_ON_HANGUP:true}
    # 采样率：1.0 全量质检；可按坐席规模调为 0.1~0.5 抽检
    sample-rate: ${AI_QUALITY_SAMPLE_RATE:1.0}
    # P1-7：规则引擎违禁词（逗号分隔；不配置则用代码内置清单：承诺胜诉/包赢/私自收费/风险代理等）
    banned-words: ${AI_QUALITY_BANNED_WORDS:承诺胜诉,包赢,保证打赢,官司包在我身上,私自收费,私下收费,风险代理,私了费,拿钱办事}
  # P3-E3 话后 AI 通话小结
  call-summary:
    # 小结总开关：关闭后手动接口与质检联动均不生成
    enabled: ${AI_CALL_SUMMARY_ENABLED:true}
    # 质检完成（转写已就绪）后自动联动生成小结
    auto-on-inspect: ${AI_CALL_SUMMARY_AUTO_ON_INSPECT:true}
  # P3-E3（二阶段）/ws/voice 语音机器人对话引擎：ASR final → RAG → LLM → TTS 播报
  voice-robot:
    # 总开关：默认关闭（政务内网模型就绪后再开）；关闭时 ask/robot 回合返回转人工兜底话术
    enabled: ${AI_VOICE_ROBOT_ENABLED:false}
    # 播报答复长度上限（字，超出截断）
    answer-max-chars: ${AI_VOICE_ROBOT_ANSWER_MAX_CHARS:150}
    # RAG 上下文装配长度上限（字，防超 token）
    context-max-chars: ${AI_VOICE_ROBOT_CONTEXT_MAX_CHARS:1200}
  # P3-E4 实时情绪/意图识别与路由/SLA 联动（纯词库，零额外成本）
  emotion-detector:
    # 总开关：仅 caller 角色/robot 模式通道挂钩（坐席自身语音不识别）
    enabled: ${AI_EMOTION_DETECTOR_ENABLED:true}
    # urgent 紧急危机排队优先级（普通来电 priority=0，ACD 按 priority desc 取队）
    urgent-priority: ${AI_EMOTION_URGENT_PRIORITY:100}
    # negative 负面情绪排队优先级（高于普通、低于 urgent）
    negative-priority: ${AI_EMOTION_NEGATIVE_PRIORITY:50}
  # P3-F4 坐席 Copilot 实时辅助（ASR final 节流 → 要素/法条/相似工单）
  copilot:
    # 总开关：关闭后不下发任何 Copilot 帧（无模型时服务内部静默降级，成本为零）
    enabled: ${AI_COPILOT_ENABLED:true}
    # 推荐法条条数（RAG Top-N）
    law-limit: ${AI_COPILOT_LAW_LIMIT:3}
    # 相似工单条数（已办结/已归档）
    ticket-limit: ${AI_COPILOT_TICKET_LIMIT:3}
    # P1-8：相似工单语义向量检索开关（向量持久化在 ai_call_ticket；关闭回退 LIKE 短语匹配）
    ticket-vector-enabled: ${AI_COPILOT_TICKET_VECTOR_ENABLED:true}
    # P1-8：工单向量命中阈值（余弦相似度，低于不推荐）
    ticket-similarity-threshold: ${AI_COPILOT_TICKET_SIMILARITY_THRESHOLD:0.5}

# ============================================================
# 语音引擎配置（TTS / ASR）。ASR 为 OpenAI/Whisper 兼容端点
# （faster-whisper-server、vLLM 等），T4-1 质检转写复用该配置
# ============================================================
voice:
  # 默认语音引擎：mock（未配置时返回空串占位）/ ali / dianxin / dashscope
  engine: ${VOICE_ENGINE:mock}
  dashscope-api-key: ${VOICE_DASHSCOPE_API_KEY:}
  dashscope-base-url: ${VOICE_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  dashscope-tts-model: ${VOICE_DASHSCOPE_TTS_MODEL:cosyvoice-v1}
  # A2：流式 ASR 模型（全双工 WebSocket，/ws/voice engine=dashscope 时生效）
  dashscope-asr-model: ${VOICE_DASHSCOPE_ASR_MODEL:paraformer-realtime-v2}
  dashscope-voice: ${VOICE_DASHSCOPE_VOICE:longxiaochun}
  # ASR（Whisper 兼容 /audio/transcriptions）：质检转写依赖，未部署时质检转写为空置失败
  asr-base-url: ${VOICE_ASR_BASE_URL:http://localhost:8000/v1}
  asr-api-key: ${VOICE_ASR_API_KEY:}
  asr-model: ${VOICE_ASR_MODEL:whisper-1}
  asr-language: ${VOICE_ASR_LANGUAGE:zh}
  # A4：/ws/voice 服务端 VAD（能量+过零率，语音起始≤80ms/尾静默400ms），关闭后不做自动 barge-in
  vad-enabled: ${VOICE_VAD_ENABLED:true}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: ai.lawyers.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置：生产环境必须关闭（通过环境变量 SWAGGER_ENABLED=true 仅在开发环境开启）
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: /dev-api

# springdoc-openapi（替代 springfox）：跟随 swagger.enabled 开关
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接：覆盖坐席业务接口 /lawyers/** 与公众端 /aiuser/**（F8 安全基线）
  urlPatterns: /system/*,/monitor/*,/tool/*,/lawyers/*,/aiuser/*

# ============================================================
# 公众端文本内容安全（F8 安全基线，2026-09-17）
# 本地敏感词过滤，离线环境可用；命中即拒绝入库。词库逗号分隔，
# 生产可经 CONTENT_SAFETY_WORDS 环境变量扩充或替换为第三方内容安全 API（仅改 ContentSafetyService）。
# ============================================================
content:
  safety:
    enabled: ${CONTENT_SAFETY_ENABLED:true}
    words: ${CONTENT_SAFETY_WORDS:法轮功,台独,藏独,港独,暴恐,枪支弹药,买卖毒品,代开发票,办假证,诈骗电话,色情服务,一夜情,外挂软件,翻墙软件}

# ============================================================
# 运营商线路对接与外呼调度配置
# ============================================================
call:
  # ---------- 录音文件（T4-1 质检读取本地录音） ----------
  recording:
    # 录音文件基础路径（对应 FreeSWITCH recordings_dir）：默认相对工作目录的 recordings（跨平台），
    # 生产/本机 FreeSWITCH 须经 CALL_RECORDING_BASE_PATH 显式指定真实目录（如 /var/lib/freeswitch/recordings）
    base-path: ${CALL_RECORDING_BASE_PATH:recordings}
    # F2：存储类型（local=本地文件系统，s3=对象存储；默认 local 完全向后兼容）
    type: ${CALL_RECORDING_TYPE:local}
    # F2：对象存储配置（type=s3 时必填）
    s3:
      # 端点（如 oss-cn-guangzhou.aliyuncs.com / minio.gov.cn:9000）
      endpoint: ${CALL_RECORDING_S3_ENDPOINT:}
      # 存储桶
      bucket: ${CALL_RECORDING_S3_BUCKET:}
      # AccessKey
      access-key: ${CALL_RECORDING_S3_ACCESS_KEY:}
      # SecretKey
      secret-key: ${CALL_RECORDING_S3_SECRET_KEY:}
      # 区域（如 cn-guangzhou / us-east-1）
      region: ${CALL_RECORDING_S3_REGION:cn-guangzhou}
      # 路径风格（MinIO 为 true，OSS/OBS/COS 为 false）
      path-style: ${CALL_RECORDING_S3_PATH_STYLE:false}
      # 预签名 URL 有效时长（秒）
      url-expiry-seconds: ${CALL_RECORDING_S3_URL_EXPIRY_SECONDS:3600}
      # 对象 key 前缀
      key-prefix: ${CALL_RECORDING_S3_KEY_PREFIX:recordings/}
      # 上传成功后是否删除本地文件
      delete-local-after-upload: ${CALL_RECORDING_S3_DELETE_LOCAL:true}

    # P0-5：上传/加密 worker 池（S3 上传与本地加密共用）——多 worker 并行，失败指数退避重试
    upload:
      workers: ${CALL_RECORDING_UPLOAD_WORKERS:2}
      queue-capacity: ${CALL_RECORDING_UPLOAD_QUEUE_CAPACITY:1000}
      # 单文件最大尝试次数（含首次），全部失败后保留本地文件待人工/定时扫描
      max-attempts: ${CALL_RECORDING_UPLOAD_MAX_ATTEMPTS:3}
      # 退避基数（毫秒）：第 N 次失败后等待 base * 2^(N-1)
      retry-backoff-base-ms: ${CALL_RECORDING_UPLOAD_BACKOFF_BASE_MS:1000}
      # RECORD_STOP 后等待文件落盘就绪：文件存在+长度>0+长度连续两次轮询不变
      ready-timeout-seconds: ${CALL_RECORDING_READY_TIMEOUT_SECONDS:30}
      ready-poll-interval-ms: ${CALL_RECORDING_READY_POLL_INTERVAL_MS:500}

  # ---------- P0-2：运营大屏预聚合数据源 ----------
  dashboard:
    # true（默认）：呼叫汇总/趋势读 ai_stat_minute 分钟级物化表（降低大屏实时聚合压力）；
    # false：回退业务表实时聚合。查历史区间前须先用 POST /lawyers/report/stat/backfill 回填
    preagg-enabled: ${DASHBOARD_PREAGG_ENABLED:true}

  # ---------- P3-B2：统一 PBX 事件入 Stream 开关 ----------
  # true（默认）：ESL/AMI 两侧桥的事件统一投递 stream:call-event 异步消费（CallEventBus 入队 →
  #   CallEventDispatcher 消费组路由 → CallEventProcessor 状态机/坐席推送/自动化工单）；
  # false：回退同步直调（应急回退用，与 V2.50 语义一致）。
  event:
    stream-enabled: ${CALL_EVENT_STREAM_ENABLED:true}

  # ---------- P3-B3：PBX 媒体接入（mod_audio_fork，来电者 PCM 源） ----------
  pbx:
    media:
      # 媒体接入总开关
      enabled: ${CALL_PBX_MEDIA_ENABLED:true}
      # 共享密钥（PBX dialplan URL 带 ?key=；为空不校验，仅限完全隔离内网+IP白名单）
      auth-key: ${CALL_PBX_MEDIA_AUTH_KEY:}
      # fork start 未携带采样率时的默认值
      default-rate: ${CALL_PBX_MEDIA_DEFAULT_RATE:16000}

  # ---------- 呼叫调度 ----------
  dispatch:
    # 全局最大并发呼叫数（应小于所有线路 max_concurrent 之和）
    maxGlobalConcurrent: 200
    # 是否启用排队机制
    queueEnabled: true
    # 排队队列容量，超出后拒绝新呼叫并告警
    queueCapacity: 2000
    # 排队最长等待时间(ms)，超时丢弃
    queueTimeoutMs: 60000
    # 调度线程轮询间隔(ms)
    scanIntervalMs: 200
    # [N2] 多实例集群调度开关：true 时全局并发/CPS/呼叫占用/排队队列外置到 Redis，
    #       实现跨实例一致的并发限速与负载分发；false（默认）走原 JVM 内存态，单实例零变化。
    cluster:
      enabled: ${CALL_DISPATCH_CLUSTER_ENABLED:false}
    # [P3-C1] 调度状态看门狗（仅集群模式生效，多实例经 Redis 单主执行）：
    #   全局并发计数按 DB 线路并发合计做漂移矫正（只向下回收泄漏槽位）+
    #   残留呼叫线路占用 holder 分钟级清理；watchdog 默认开启，单机模式自动跳过。
    watchdog:
      enabled: ${CALL_DISPATCH_WATCHDOG_ENABLED:true}
      # 扫描间隔(ms)
      interval-ms: ${CALL_DISPATCH_WATCHDOG_INTERVAL_MS:300000}
      # 启动后首次扫描延迟(ms)
      initial-delay-ms: ${CALL_DISPATCH_WATCHDOG_INITIAL_DELAY_MS:120000}
      # 在途余量：Redis 计数高于「DB线路并发合计+余量」才向下矫正，覆盖占位/释放提交窗口
      inflight-margin: ${CALL_DISPATCH_WATCHDOG_INFLIGHT_MARGIN:8}

  # ---------- 线路监控与告警 ----------
  monitor:
    # 监控定时任务总开关
    enabled: true
    # 健康探测间隔(ms)
    healthCheckIntervalMs: 30000
    # 熔断恢复探测间隔(ms)
    circuitRecoverIntervalMs: 30000
    # 熔断冷却时长(秒)，冷却结束后半开探测
    circuitCooldownSeconds: 120
    # 质量指标聚合 cron（每分钟第5秒统计上一分钟）
    metricCron: 5 * * * * ?
    # 质量告警评估间隔(ms)
    alarmIntervalMs: 120000
    # 同线路同类型告警抑制窗口(分钟)
    alarmSuppressMinutes: 10
    # 接通率告警最小样本量，低于该值不告警避免误报
    minSampleForAlarm: 20
    # 并发使用率告警阈值(%)
    concurrentPercentThreshold: 90
    # MOS 语音质量告警阈值
    mosThreshold: 3.0

  # ---------- 智能外呼执行引擎 ----------
  outbound:
    # 是否启用定时扫描执行（运行中的任务自动拨号）
    scanEnabled: true
    # 定时扫描间隔(ms)
    scanIntervalMs: 15000
    # 模拟接通：无真实语音网关时，下发成功后直接模拟接通并进入IVR全链路
    # 仅限开发/测试联调使用，生产环境必须通过环境变量 CALL_OUTBOUND_SIMULATEANSWER=false 关闭（启动会强告警）
    simulateAnswer: ${CALL_OUTBOUND_SIMULATEANSWER:true}
    # 模拟接通后的通话时长(秒)，仅模拟模式生效
    simulateTalkSeconds: 45
    # 回访类任务或转人工类外呼接通后自动创建工单
    autoCreateTicket: true
    # ---------- W4 外呼合规 ----------
    compliance:
      # 合规总开关（时段+退订拦截），生产保持 true
      enabled: true
      # 允许外呼时段，格式 HH:mm-HH:mm，多段逗号分隔（如 09:00-12:00,14:00-21:00）
      allowed-hours: ${CALL_OUTBOUND_ALLOWED_HOURS:09:00-21:00}
      # 时区
      timezone: Asia/Shanghai

  # ---------- 入站呼叫（PSTN/分机来电 → 排队 → 坐席） ----------
  inbound:
    # 是否启用入站呼叫自动处理（ESL 监听到 CHANNEL_CREATE[inbound] 后触发）
    enabled: true
    # 默认技能组ID（DNIS 未匹配到技能组时使用）
    defaultGroupId: 104

  # ---------- 语音网关 / CTI 中间件 ----------
  gateway:
    # ESL 入站长连接总开关（监听 FreeSWITCH 实时呼叫事件）
    # 部署真实 FreeSWITCH 时置为 true，并在“资源管理-运营商线路”中配置 vendor=FREESWITCH 的线路
    esl:
      enabled: true
      # N3 单主竞选：多实例时仅领导者建立 ESL 入站连接消费事件，崩溃后 TTL 到期自动切换
      # 单机/应急可置 false 恢复各实例各自建连（多实例会重复消费事件）
      leader-election:
        enabled: ${ESL_LEADER_ELECTION_ENABLED:true}
        key: ${ESL_LEADER_ELECTION_KEY:ai-law:leader:esl-bridge}
        ttl-seconds: ${ESL_LEADER_ELECTION_TTL_SECONDS:30}
    # FreeSWITCH ESL：生产环境通过环境变量注入强口令，禁止使用默认 ClueCon
    freeswitch:
      eslPort: ${ESL_PORT:8021}
      eslPassword: ${ESL_PASSWORD:ClueCon}
      timeout: 5000
      context: default
    # Asterisk AMI：生产环境通过环境变量注入强口令，禁止使用默认 admin/amp111
    asterisk:
      # V2.53：命令面实时查询（PJSIPShowEndpoints 注册态等）目标主机；命令面池按 host:amiPort 建连，
      # 部署时后端与 Asterisk 同机默认 127.0.0.1，跨机时通过环境变量注入
      host: ${ASTERISK_HOST:127.0.0.1}
      amiPort: ${AMI_PORT:5038}
      amiUser: ${AMI_USER:admin}
      amiPassword: ${AMI_PASSWORD:amp111}
      timeout: 5000
      context: from-internal
      # P3-B5（V2.52）：PJSIP/队列只读模型配置目录——后端解析该目录下 pjsip.conf/queues.conf
      # （含 #include 展开）只读展示端点与队列，平台不下发配置；部署时后端与 Asterisk 同机或挂载
      # 其配置目录。文件不存在时接口返回空结果并标注未找到，不影响启动与监控页
      config-dir: ${ASTERISK_CONFIG_DIR:/etc/asterisk}
    # B1 AMI 事件桥（V2.50）：常驻连接订阅 AMI 事件（Login 后 Events: all），事件经
    # Newchannel/Dial/Newstate/BridgeEnter/Hangup/QueueMemberStatus 映射后驱动 B4 状态机
    # 与坐席状态同步（与 ESL 桥同构）。部署真实 Asterisk 时置 true；事件/命令双通道分离，
    # 命令面仍走 pool 长连接（Events: off）
    ami:
      enabled: ${AMI_EVENT_ENABLED:false}
      # N3 同款单主竞选：多实例时仅领导者建立 AMI 事件连接，锁键与 ESL 桥独立
      leader-election:
        enabled: ${AMI_LEADER_ELECTION_ENABLED:true}
        key: ${AMI_LEADER_ELECTION_KEY:ai-law:leader:ami-bridge}
        ttl-seconds: ${AMI_LEADER_ELECTION_TTL_SECONDS:30}
    # B3 命令面池化（V2.49）：originate/hangup/transfer 复用 ESL/AMI 长连接 + 命令队列，
    # 消除高话务下每动作新建 Socket 的建连风暴；连接断开自动重建，连续 5s 未就绪开熔断
    # （冷却 circuit-open-ms 后半开探测），打开期间命令快速失败并 WARN 告警。
    # 置 false 回退历史短连接模式（每命令独立建连）
    pool:
      esl-enabled: ${ESL_CMD_POOL_ENABLED:true}
      ami-enabled: ${AMI_CMD_POOL_ENABLED:true}
      circuit-open-ms: ${GATEWAY_CMD_POOL_CIRCUIT_OPEN_MS:60000}
    # 通用 HTTP OpenAPI 网关（云 CTI / SBC 北向接口）
    http:
      originatePath: /call/originate
      hangupPath: /call/hangup
      transferPath: /call/transfer
      statusPath: /trunk/status
      timeout: 5000
    # 模拟网关（无真实网关时兜底，successRate 可用于验证故障切换）
    simulator:
      successRate: 100

  # ---------- 网关/内部回调签名校验（S7 安全收口） ----------
  callback:
    # 生产环境必须置为 true，对网关事件回调强制 HMAC-SHA256 签名+时间戳窗口校验
    sign-enabled: ${CALLBACK_SIGN_ENABLED:false}
    # 签名密钥：生产必须通过环境变量 CALLBACK_SIGN_SECRET 注入 >=32 字节随机串
    sign-secret: ${CALLBACK_SIGN_SECRET:ai-lawyers-callback-dev-secret-change-me-2026}

  # ---------- 短信上行回调（W4 退订合规入口） ----------
  sms:
    upstream:
      # 总开关：短信服务商上行推送地址 POST /lawyers/sms/upstream
      enabled: ${SMS_UPSTREAM_ENABLED:true}
      # token 校验（服务商无法携带自定义 header 时使用，与签名二选一；生产必须配置其一）
      token: ${SMS_UPSTREAM_TOKEN:}
      # 同号码每分钟退订频控（<=0 表示不限制）
      rate-limit-per-min: ${SMS_UPSTREAM_RATE_LIMIT:10}
