# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径：生产环境必须通过环境变量 RUOYI_PROFILE 显式指定挂载目录（如 /data/ai-lawyers/uploadPath）
  profile: ${RUOYI_PROFILE:./data/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 文件上传路径配置
file:
  path: ${RUOYI_PROFILE:./data/uploadPath}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数（与下游DB/Redis连接池容量匹配，避免容量倒挂）
    accept-count: 200
    threads:
      # tomcat最大线程数：按下游容量反推（DB连接池50），勿盲目调大
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 20

# 日志配置：生产环境保持 info，debug 会记录咨询文本等隐私内容（合规风险）
logging:
  level:
    ai.lawyers: info
    org.springframework: warn

# ============================================================
# T5-1 监控暴露：actuator + micrometer-prometheus
# 仅暴露 prometheus/health/info；生产建议经内网/网关 ACL 限制抓取源，
# 或通过 management.server.port 使用独立管理端口
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ai-lawyers-hotline
    distribution:
      # 百分位直方图，供 Prometheus histogram_quantile 计算 P95/P99
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # 密码：生产环境必须通过环境变量 REDIS_PASSWORD 注入强密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 4
        # 连接池中的最大空闲连接
        max-idle: 16
        # 连接池的最大数据库连接数（与Tomcat线程数匹配，消除容量倒挂）
        max-active: 32
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 3000ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：生产环境必须通过环境变量 TOKEN_SECRET 注入 >=32字节随机密钥，禁止使用默认值入库入git
  secret: ${TOKEN_SECRET:Z2xwLWExMmwtbGF3eWVycy1qd3Qtc2VjcmV0LWtleS0yMDI2LWNoYW5nZS1tZS1pbi1wcm9kLTA5ODc2NTQz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# ============================================================
# AI 大模型调用与 RAG 检索配置（T2-1 连接池 / T3 RAG 混合检索）
# ============================================================
ai:
  model:
    # 在途大模型调用并发舱壁（与 DB/Redis 连接池、模型侧限流匹配）
    max-inflight: ${AI_MODEL_MAX_INFLIGHT:32}
    # 获取在途许可最长等待（毫秒），超时快速失败
    acquire-timeout-ms: ${AI_MODEL_ACQUIRE_TIMEOUT_MS:3000}
    http:
      # OkHttp 共享连接池：最大空闲连接、保活秒数、建连超时毫秒
      maxIdleConnections: ${AI_HTTP_MAX_IDLE:32}
      keepAliveSeconds: ${AI_HTTP_KEEPALIVE_SECONDS:300}
      connectTimeoutMs: ${AI_HTTP_CONNECT_TIMEOUT_MS:10000}
  rag:
    # RAG 总开关：关闭后智能体不检索知识、退回纯模型对话；分块/向量索引不重建
    enabled: ${AI_RAG_ENABLED:true}
    # embedding 专用模型配置ID（ai_model_config 中指向 /v1/embeddings 兼容端点，如 bge-small-zh）
    embedding-config-id: ${AI_RAG_EMBEDDING_CONFIG_ID:0}
    # embedding 模型名（config-id 未配置时，用默认模型的 apiUrl/apiKey + 此模型名）
    embedding-model: ${AI_RAG_EMBEDDING_MODEL:}
    # 最终拼 Prompt 的知识条数
    top-k: ${AI_RAG_TOP_K:3}
    # 每路召回候选数（融合池大小）
    candidate-size: ${AI_RAG_CANDIDATE_SIZE:20}
    # 单块拼入 Prompt 的最大字符数
    chunk-max-len: ${AI_RAG_CHUNK_MAX_LEN:500}
    # Cross-Encoder rerank 精排（需部署 rerank 服务，默认关闭）
    rerank-enabled: ${AI_RAG_RERANK_ENABLED:false}
    rerank-url: ${AI_RAG_RERANK_URL:}
    rerank-model: ${AI_RAG_RERANK_MODEL:bge-reranker-base}
    rerank-api-key: ${AI_RAG_RERANK_API_KEY:}
  # T4-1 智能质检
  quality:
    # 质检总开关：关闭则不投递/不消费质检任务
    enabled: ${AI_QUALITY_ENABLED:true}
    # 录音就绪后是否自动入检
    auto-on-hangup: ${AI_QUALITY_AUTO_ON_HANGUP:true}
    # 采样率：1.0 全量质检；可按坐席规模调为 0.1~0.5 抽检
    sample-rate: ${AI_QUALITY_SAMPLE_RATE:1.0}

# ============================================================
# 语音引擎配置（TTS / ASR）。ASR 为 OpenAI/Whisper 兼容端点
# （faster-whisper-server、vLLM 等），T4-1 质检转写复用该配置
# ============================================================
voice:
  # 默认语音引擎：mock（未配置时返回空串占位）/ ali / dianxin / dashscope
  engine: ${VOICE_ENGINE:mock}
  dashscope-api-key: ${VOICE_DASHSCOPE_API_KEY:}
  dashscope-base-url: ${VOICE_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  dashscope-tts-model: ${VOICE_DASHSCOPE_TTS_MODEL:cosyvoice-v1}
  dashscope-voice: ${VOICE_DASHSCOPE_VOICE:longxiaochun}
  # ASR（Whisper 兼容 /audio/transcriptions）：质检转写依赖，未部署时质检转写为空置失败
  asr-base-url: ${VOICE_ASR_BASE_URL:http://localhost:8000/v1}
  asr-api-key: ${VOICE_ASR_API_KEY:}
  asr-model: ${VOICE_ASR_MODEL:whisper-1}
  asr-language: ${VOICE_ASR_LANGUAGE:zh}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: ai.lawyers.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置：生产环境必须关闭（通过环境变量 SWAGGER_ENABLED=true 仅在开发环境开启）
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接：覆盖业务接口 /lawyers/**（IVR脚本/知识库等富文本内容由后端按需转义）
  urlPatterns: /system/*,/monitor/*,/tool/*,/lawyers/*

# ============================================================
# 运营商线路对接与外呼调度配置
# ============================================================
call:
  # ---------- 录音文件（T4-1 质检读取本地录音） ----------
  recording:
    # 录音文件基础路径（对应 FreeSWITCH recordings_dir）
    base-path: ${CALL_RECORDING_BASE_PATH:C:/Program Files/FreeSWITCH/recordings}

  # ---------- 呼叫调度 ----------
  dispatch:
    # 全局最大并发呼叫数（应小于所有线路 max_concurrent 之和）
    maxGlobalConcurrent: 200
    # 是否启用排队机制
    queueEnabled: true
    # 排队队列容量，超出后拒绝新呼叫并告警
    queueCapacity: 2000
    # 排队最长等待时间(ms)，超时丢弃
    queueTimeoutMs: 60000
    # 调度线程轮询间隔(ms)
    scanIntervalMs: 200

  # ---------- 线路监控与告警 ----------
  monitor:
    # 监控定时任务总开关
    enabled: true
    # 健康探测间隔(ms)
    healthCheckIntervalMs: 30000
    # 熔断恢复探测间隔(ms)
    circuitRecoverIntervalMs: 30000
    # 熔断冷却时长(秒)，冷却结束后半开探测
    circuitCooldownSeconds: 120
    # 质量指标聚合 cron（每分钟第5秒统计上一分钟）
    metricCron: 5 * * * * ?
    # 质量告警评估间隔(ms)
    alarmIntervalMs: 120000
    # 同线路同类型告警抑制窗口(分钟)
    alarmSuppressMinutes: 10
    # 接通率告警最小样本量，低于该值不告警避免误报
    minSampleForAlarm: 20
    # 并发使用率告警阈值(%)
    concurrentPercentThreshold: 90
    # MOS 语音质量告警阈值
    mosThreshold: 3.0

  # ---------- 智能外呼执行引擎 ----------
  outbound:
    # 是否启用定时扫描执行（运行中的任务自动拨号）
    scanEnabled: true
    # 定时扫描间隔(ms)
    scanIntervalMs: 15000
    # 模拟接通：无真实语音网关时，下发成功后直接模拟接通并进入IVR全链路
    # 仅限开发/测试联调使用，生产环境必须通过环境变量 CALL_OUTBOUND_SIMULATEANSWER=false 关闭（启动会强告警）
    simulateAnswer: ${CALL_OUTBOUND_SIMULATEANSWER:true}
    # 模拟接通后的通话时长(秒)，仅模拟模式生效
    simulateTalkSeconds: 45
    # 回访类任务或转人工类外呼接通后自动创建工单
    autoCreateTicket: true

  # ---------- 入站呼叫（PSTN/分机来电 → 排队 → 坐席） ----------
  inbound:
    # 是否启用入站呼叫自动处理（ESL 监听到 CHANNEL_CREATE[inbound] 后触发）
    enabled: true
    # 默认技能组ID（DNIS 未匹配到技能组时使用）
    defaultGroupId: 104

  # ---------- 语音网关 / CTI 中间件 ----------
  gateway:
    # ESL 入站长连接总开关（监听 FreeSWITCH 实时呼叫事件）
    # 部署真实 FreeSWITCH 时置为 true，并在“资源管理-运营商线路”中配置 vendor=FREESWITCH 的线路
    esl:
      enabled: true
    # FreeSWITCH ESL：生产环境通过环境变量注入强口令，禁止使用默认 ClueCon
    freeswitch:
      eslPort: ${ESL_PORT:8021}
      eslPassword: ${ESL_PASSWORD:ClueCon}
      timeout: 5000
      context: default
    # Asterisk AMI：生产环境通过环境变量注入强口令，禁止使用默认 admin/amp111
    asterisk:
      amiPort: ${AMI_PORT:5038}
      amiUser: ${AMI_USER:admin}
      amiPassword: ${AMI_PASSWORD:amp111}
      timeout: 5000
      context: from-internal
    # 通用 HTTP OpenAPI 网关（云 CTI / SBC 北向接口）
    http:
      originatePath: /call/originate
      hangupPath: /call/hangup
      transferPath: /call/transfer
      statusPath: /trunk/status
      timeout: 5000
    # 模拟网关（无真实网关时兜底，successRate 可用于验证故障切换）
    simulator:
      successRate: 100

  # ---------- 网关/内部回调签名校验（S7 安全收口） ----------
  callback:
    # 生产环境必须置为 true，对网关事件回调强制 HMAC-SHA256 签名+时间戳窗口校验
    sign-enabled: ${CALLBACK_SIGN_ENABLED:false}
    # 签名密钥：生产必须通过环境变量 CALLBACK_SIGN_SECRET 注入 >=32 字节随机串
    sign-secret: ${CALLBACK_SIGN_SECRET:ai-lawyers-callback-dev-secret-change-me-2026}
