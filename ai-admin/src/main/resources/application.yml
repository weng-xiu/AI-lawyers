# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 文件上传路径配置
file:
  path: D:/ruoyi/uploadPath

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    ai.lawyers: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: ai.lawyers.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# ============================================================
# 运营商线路对接与外呼调度配置
# ============================================================
call:
  # ---------- 呼叫调度 ----------
  dispatch:
    # 全局最大并发呼叫数（应小于所有线路 max_concurrent 之和）
    maxGlobalConcurrent: 200
    # 是否启用排队机制
    queueEnabled: true
    # 排队队列容量，超出后拒绝新呼叫并告警
    queueCapacity: 2000
    # 排队最长等待时间(ms)，超时丢弃
    queueTimeoutMs: 60000
    # 调度线程轮询间隔(ms)
    scanIntervalMs: 200

  # ---------- 线路监控与告警 ----------
  monitor:
    # 监控定时任务总开关
    enabled: true
    # 健康探测间隔(ms)
    healthCheckIntervalMs: 30000
    # 熔断恢复探测间隔(ms)
    circuitRecoverIntervalMs: 30000
    # 熔断冷却时长(秒)，冷却结束后半开探测
    circuitCooldownSeconds: 120
    # 质量指标聚合 cron（每分钟第5秒统计上一分钟）
    metricCron: 5 * * * * ?
    # 质量告警评估间隔(ms)
    alarmIntervalMs: 120000
    # 同线路同类型告警抑制窗口(分钟)
    alarmSuppressMinutes: 10
    # 接通率告警最小样本量，低于该值不告警避免误报
    minSampleForAlarm: 20
    # 并发使用率告警阈值(%)
    concurrentPercentThreshold: 90
    # MOS 语音质量告警阈值
    mosThreshold: 3.0

  # ---------- 语音网关 / CTI 中间件 ----------
  gateway:
    # FreeSWITCH ESL
    freeswitch:
      eslPort: 8021
      eslPassword: ClueCon
      timeout: 5000
      context: default
    # Asterisk AMI
    asterisk:
      amiPort: 5038
      amiUser: admin
      amiPassword: amp111
      timeout: 5000
      context: from-internal
    # 通用 HTTP OpenAPI 网关（云 CTI / SBC 北向接口）
    http:
      originatePath: /call/originate
      hangupPath: /call/hangup
      transferPath: /call/transfer
      statusPath: /trunk/status
      timeout: 5000
    # 模拟网关（无真实网关时兜底，successRate 可用于验证故障切换）
    simulator:
      successRate: 100
