# 全局基础配置（本文件被主 nginx.conf 的 http {} 引入）
server_tokens off;

# gzip
gzip on;
gzip_min_length 1k;
gzip_types text/plain application/javascript application/x-javascript text/css application/json image/svg+xml;

# ===== HTTP =====
# 默认保留直连；生产设置 TLS_FORCE_REDIRECT=true 后由启动脚本改为 301 跳转 HTTPS。
server {
    listen       80;
    server_name  _;
    charset utf-8;

    include /etc/nginx/snippets/tls-redirect.conf;

    # P3-①：统一安全响应头（HSTS 仅在 HTTPS 下发，见下方 server）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    # 允许 Vue 运行时的内联样式/脚本与 blob 媒体；上线后可按实际资源收紧
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    include /etc/nginx/snippets/app-locations.conf;
}

# ===== HTTPS =====
# 证书目录 /etc/nginx/certs（server.crt/server.key）：
#   - 生产：挂载正式证书，容器启动时检测到即直接使用；
#   - 本地：缺失时由 40-tls-setup.sh 生成自签证书，保证开箱可启动。
server {
    listen       443 ssl http2;
    server_name  _;
    charset utf-8;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    include /etc/nginx/snippets/app-locations.conf;
}
