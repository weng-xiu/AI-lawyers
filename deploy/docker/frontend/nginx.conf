server {
    listen       80;
    server_name  _;
    charset utf-8;

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 单页应用路由回退
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript application/x-javascript text/css application/json image/svg+xml;

    # ===== 后端 REST API（前端 VUE_APP_BASE_API=/prod-api） =====
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 去掉 /prod-api 前缀转发到后端
        proxy_pass http://backend:8080/;
        client_max_body_size 20m;
    }

    # ===== 呼叫事件 WebSocket：/ws/call/{userId} =====
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== FreeSWITCH WebRTC WebSocket 反向代理（供浏览器 wss/ws 注册软电话）=====
    # 浏览器访问 ws://<前端服务器>/fs-ws -> FreeSWITCH 内部 5066
    location /fs-ws {
        proxy_pass http://freeswitch:5066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
