# Alertmanager 最小本地配置（N6 语雀 7.8）
# 默认仅分组去重并在 UI 展示，不外发；生产接入钉钉/飞书/邮件时在 receivers 增加 webhook_configs/email_configs。
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "slo"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    # 占位：生产在此补 webhook/email，例如
    # webhook_configs:
    #   - url: http://notify-gateway/hook/alert

inhibit_rules:
  # 同一 SLO 严重告警抑制后续重复
  - source_matchers: [severity="warning"]
    target_matchers: [severity="info"]
    equal: ["slo", "alertname"]
