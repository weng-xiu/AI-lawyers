# Grafana 数据源自动装配（N6 语雀 7.8）
# 容器启动时自动注入 Prometheus 数据源，无需手工配置
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 固定 UID，dashboard JSON 中通过该 UID 引用数据源
    uid: ai12348-prom
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
