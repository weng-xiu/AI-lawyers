# =====================================================================
# 广东12348公共法律服务热线 —— Prometheus 抓取配置（N6 语雀 7.8）
#
# 抓取目标：backend 容器独立管理端口 8081 的 /actuator/prometheus
#   - 业务端口 8080 与管理端口 8081 隔离，仅容器内网 ccnet 可抓，不映射宿主
#   - 指标统一带 application=ai-lawyers-hotline 标签（见 application.yml management.metrics.tags）
#
# 启动方式见 deploy/monitoring/docker-compose.monitoring.yml
# =====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: ai12348-hotline

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    # 默认随监控栈起一个 alertmanager；未部署时告警仅在 Prometheus UI 可见，不影响抓取
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ai12348-backend
    metrics_path: /actuator/prometheus
    scheme: http
    # backend 多实例时由 compose/DNS 自动展开；单实例即一个 endpoint
    dns_sd_configs:
      - names:
          - backend
        type: A
        port: 8081
    # 兜底：若后端服务名非 backend 或本地联调，改用下面的静态目标（注释切换）
    # static_configs:
    #   - targets: ['backend:8081']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
